name: Windows Build

on:
  push:
    branches: [main, "feat/**", "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build Test Publish x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MyPC.LanPrintDoctor.sln

      - name: Build Release
        run: dotnet build MyPC.LanPrintDoctor.sln -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/MyPC.LanPrintDoctor.UnitTests/MyPC.LanPrintDoctor.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Integration tests (safe/isolated)
        run: |
          dotnet test tests/MyPC.LanPrintDoctor.IntegrationTests/MyPC.LanPrintDoctor.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results

      - name: Publish WPF win-x64 self-contained
        run: |
          dotnet publish src/MyPC.LanPrintDoctor/MyPC.LanPrintDoctor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish/win-x64

      - name: Package RELEASE ZIP + SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $stage = "artifacts/release/stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse artifacts/publish/win-x64/* $stage/
          Copy-Item README.md $stage/README.md -ErrorAction SilentlyContinue
          Copy-Item docs/RUNBOOK.md $stage/RUNBOOK.md -ErrorAction SilentlyContinue
          $zip = "artifacts/release/MyPC-PrintDoctor-RELEASE-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/release/SHA256.txt -Value "$hash  MyPC-PrintDoctor-RELEASE-x64.zip"
          Set-Content -Path artifacts/release/BUILD-INFO.txt -Value @"
          commit=$env:GITHUB_SHA
          ref=$env:GITHUB_REF
          runner=$env:RUNNER_OS
          configuration=Release
          rid=win-x64
          self-contained=true
          "@

      - name: Test summary
        shell: pwsh
        run: |
          $trx = Get-ChildItem artifacts/test-results -Filter *.trx -ErrorAction SilentlyContinue
          $lines = @("# Test Summary", "", "Commit: $env:GITHUB_SHA", "")
          foreach ($t in $trx) {
            $lines += "## $($t.Name)"
            $xml = [xml](Get-Content $t.FullName -Raw)
            $counters = $xml.TestRun.ResultSummary.Counters
            $lines += "total=$($counters.total) passed=$($counters.passed) failed=$($counters.failed) skipped=$($counters.total - $counters.passed - $counters.failed)"
            $lines += ""
          }
          $lines | Set-Content artifacts/test-results/TEST-SUMMARY.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyPC-PrintDoctor-windows-x64
          path: |
            artifacts/release/**
            artifacts/test-results/**
            artifacts/publish/win-x64/**
          if-no-files-found: error
